function normalize(s) {
  return s.toLowerCase().trim().replace(/\s+/g, " ");
}

function editDistance(a, b) {
  const dp = Array.from({length: a.length + 1}, () => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
    }
  }
  return dp[a.length][b.length];
}

function matchScore(query, name) {
  const q = normalize(query);
  const n = normalize(name);
  if (n === q) return 100;
  if (n.includes(q)) return 85;
  const qWords = q.split(" ");
  const nWords = n.split(" ");
  let score = 0;
  for (const qw of qWords) {
    let best = 0;
    for (const nw of nWords) {
      const d = editDistance(qw, nw);
      const maxLen = Math.max(qw.length, nw.length);
      const similarity = maxLen ? 1 - d / maxLen : 0;
      best = Math.max(best, similarity);
    }
    score += best;
  }
  return score / qWords.length * 80;
}

function showTable(guest) {
  document.getElementById("result").innerHTML = `
    <div class="welcome">
      Welcome, ${guest[0]}!
      <div class="table-label">Your table is</div>
      <div class="table-number">${guest[1]}</div>
    </div>`;
}

function findTable() {
  const input = document.getElementById("nameInput").value;
  const result = document.getElementById("result");
  const q = normalize(input);

  if (!q) {
    result.innerHTML = '<div class="error">Please enter your name.</div>';
    return;
  }

  const ranked = guests
    .map(g => ({ guest: g, score: matchScore(q, g[0]) }))
    .filter(x => x.score >= 52)
    .sort((a, b) => b.score - a.score);

  if (!ranked.length) {
    result.innerHTML = `
      <div class="error">
        We couldn't find a match.<br>
        Please check the spelling and try again.
      </div>`;
    return;
  }

  // Exact or very strong unique match: show table immediately.
  if (ranked[0].score >= 99 || (ranked[0].score >= 84 && (ranked.length === 1 || ranked[0].score - ranked[1].score >= 12))) {
    showTable(ranked[0].guest);
    return;
  }

  // Otherwise let the guest choose from suggested names.
  const suggestions = ranked.slice(0, 5);
  result.innerHTML = `
    <div style="width:100%">
      <div class="suggest-title">Did you mean?</div>
      <div class="suggestions">
        ${suggestions.map((x, i) => `
          <button class="suggestion" onclick="showTable(guests[${guests.indexOf(x.guest)}])">
            ${x.guest[0]}
          </button>
        `).join("")}
      </div>
    </div>`;
}
